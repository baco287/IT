name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ── Staging: GitHub Pages (baco287.github.io/IT) ────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (mit basePath für github.io-Unterpfad)
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /IT
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # ── Produktion: all-inkl Webspace (qontex.de) ───────────────────────────
  # Läuft erst, wenn die Secrets FTP_SERVER / FTP_USERNAME / FTP_PASSWORD
  # im Repo hinterlegt sind (gleiche Werte wie im Zulassungsdienst-Repo).
  deploy-allinkl:
    runs-on: ubuntu-latest
    env:
      HAS_FTP: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_FTP != ''
      - uses: actions/setup-node@v4
        if: env.HAS_FTP != ''
        with:
          node-version: 22
          cache: npm
      - name: Abhängigkeiten installieren
        if: env.HAS_FTP != ''
        run: npm ci
      - name: Build (Root-Pfad für qontex.de)
        if: env.HAS_FTP != ''
        run: npm run build
      - name: Per FTPS zu all-inkl deployen (lftp)
        if: env.HAS_FTP != ''
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          printf 'machine %s\nlogin %s\npassword %s\n' \
            "$FTP_SERVER" "$FTP_USERNAME" "$FTP_PASSWORD" > ~/.netrc
          chmod 600 ~/.netrc
          lftp -e "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate true;
            set ftp:passive-mode true;
            set net:max-retries 2;
            set net:timeout 60;
            open $FTP_SERVER;
            mirror -R --delete --verbose=1 ./out/ /qontex.de/;
            bye
          "
          rm -f ~/.netrc

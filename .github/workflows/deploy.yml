name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ── Staging: GitHub Pages (baco287.github.io/IT) ────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (mit basePath für github.io-Unterpfad)
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /IT
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # ── Produktion: eigener Hetzner-Server (qontex.de, 178.104.204.155) ─────
  # Kein Deploy-Job nötig: Der Server zieht main selbst per Cron alle 5 Min
  # (/opt/qontex-deploy.sh) und baut bei Änderungen neu.
